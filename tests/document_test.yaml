
# API-flow tests run their steps in order. `extract` stores a response field as
# a collection variable; later steps reference it with {{variable_name}}.
flows:
# Success login flow
  - name: Upload and download flow
    enabled: true
    save: true
    steps:
      - name: 1. - Upload
        request:
          method: POST
          path: /upload
          formdata:
            - key: file
              type: file
              src: testdata/sample_1.pdf
        extract:
          filename: filename
            

      - name: 2. Download
        # delay: 10
        request:
          method: GET
          path: "/download/{{filename}}"
            
        assertions:
          - type: status
            equals: 200
